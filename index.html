
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pemesanan</title>

    <style>
      
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .container {
            max-width: 450px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        h2 {
            text-align: center;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            font-family: Arial, sans-serif;
            background: white;
            color: #1e293b;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #16a34a;
        }

        .time-picker {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }

        .time-column {
            flex: 1;
        }

        .time-column select {
            margin-bottom: 0;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .time-preview {
            margin-top: 10px;
            text-align: center;
            font-size: 13px;
            color: #64748b;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #16a34a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #15803d;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Form Pemesanan</h2>
    <p class="subtitle">Silakan isi detail pesanan Anda</p>

    <form id="orderForm">

        <label>Tanggal</label>
        <input type="date" id="tanggal" required>

        <label>Waktu Makan</label>
        <select id="waktu" required>
            <option value="">Pilih waktu makan</option>
            <option value="Makan Pagi">Makan Pagi</option>
            <option value="Makan Siang">Makan Siang</option>
            <option value="Makan Sore">Makan Sore</option>
            <option value="Makan Malam">Makan Malam</option>
        </select>

        <label>Jam (24 Jam)</label>

        <div class="time-picker">

            <div class="time-column">
                <select id="jam" required>
                    <option value="">Jam</option>
                </select>
            </div>

            <div class="time-column">
                <select id="menit" required>
                    <option value="">Menit</option>
                </select>
            </div>

        </div>

        <div class="time-preview" id="timePreview">
            Pilih jam dan menit
        </div>

        <label>Paket</label>
        <select id="paket" required>
            <option value="">Pilih paket</option>
            <option value="Paket A">Paket A</option>
            <option value="Paket B">Paket B</option>
            <option value="Paket C">Paket C</option>
            <option value="Paket D">Paket D</option>
        </select>

        <label>Jumlah Pax</label>
        <input
            type="number"
            id="pax"
            placeholder="Masukkan jumlah pax"
            min="1"
            step="1"
            required
        >

        <label>Atas Nama</label>
        <input
            type="text"
            id="nama"
            placeholder="Masukkan nama pemesan"
            required
        >

        <label>Catatan / Request Khusus (Opsional)</label>
        <textarea
            id="note"
            placeholder="Contoh: Tidak pakai sambal, nasi dipisah, dll."
        ></textarea>

        <button type="submit">
            KIRIM ORDER VIA WHATSAPP
        </button>

    </form>

    <div class="footer">
        Form Pemesanan
    </div>

</div>

<script>

    // NOMOR WHATSAPP TUJUAN
    const nomorWA = "62882001242159";


    // OTOMATIS MENGISI TANGGAL HARI INI
    const tanggalInput = document.getElementById("tanggal");

    const hariIni = new Date();

    const tahun = hariIni.getFullYear();
    const bulan = String(hariIni.getMonth() + 1).padStart(2, "0");
    const tanggal = String(hariIni.getDate()).padStart(2, "0");

    tanggalInput.value = `${tahun}-${bulan}-${tanggal}`;


    // MEMBUAT PILIHAN JAM 00-23
    const jamSelect = document.getElementById("jam");

    for (let i = 0; i < 24; i++) {
        const angka = String(i).padStart(2, "0");

        const option = document.createElement("option");
        option.value = angka;
        option.textContent = angka;

        jamSelect.appendChild(option);
    }


    // MEMBUAT PILIHAN MENIT 00-59
    const menitSelect = document.getElementById("menit");

    for (let i = 0; i < 60; i++) {
        const angka = String(i).padStart(2, "0");

        const option = document.createElement("option");
        option.value = angka;
        option.textContent = angka;

        menitSelect.appendChild(option);
    }


    // PREVIEW JAM
    const timePreview = document.getElementById("timePreview");

    function updateTime() {
        const jam = jamSelect.value;
        const menit = menitSelect.value;

        if (jam !== "" && menit !== "") {
            timePreview.textContent = `Jam pesanan: ${jam}:${menit}`;
        } else {
            timePreview.textContent = "Pilih jam dan menit";
        }
    }

    jamSelect.addEventListener("change", updateTime);
    menitSelect.addEventListener("change", updateTime);


    // PROSES KIRIM PESANAN
    document.getElementById("orderForm")
    .addEventListener("submit", function(e) {

        e.preventDefault();

        const tanggal = document.getElementById("tanggal").value;
        const waktu = document.getElementById("waktu").value;
        const jam = jamSelect.value;
        const menit = menitSelect.value;
        const paket = document.getElementById("paket").value;
        const pax = document.getElementById("pax").value;
        const nama = document.getElementById("nama").value.trim();
        const note = document.getElementById("note").value.trim();


        // FORMAT TANGGAL: 1 Januari 2027
const [tahun, bulan, tanggalHari] = tanggal.split("-");

const namaBulan = [
    "Januari", "Februari", "Maret", "April",
    "Mei", "Juni", "Juli", "Agustus",
    "September", "Oktober", "November", "Desember"
];

const tanggalFormat =
    `${Number(tanggalHari)} ${namaBulan[Number(bulan) - 1]} ${tahun}`;


        // FORMAT JAM 24 JAM
        const jamFormat = `${jam}:${menit}`;


        // FORMAT CATATAN
        const catatan = note || "-";


        // FORMAT PESAN WHATSAPP
        const pesan =
`ORDERAN BARU

Tanggal : ${tanggalFormat}
Waktu : ${waktu}
Jam : ${jamFormat}
Paket : ${paket}
Jumlah Pax : ${pax}
Atas Nama : ${nama}
Catatan : ${catatan}`;


        // BUKA WHATSAPP
        const linkWA =
            `https://wa.me/${nomorWA}?text=${encodeURIComponent(pesan)}`;

        window.open(linkWA, "_blank");

    });

</script>

</body>
</html>
